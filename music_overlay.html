<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Overlay</title>
<style>
  :root {
    --accent: #7cf0c8;
    --ink: #f4f6f8;
    --ink-dim: rgba(244, 246, 248, .62);
    --glass: rgba(16, 18, 24, .78);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: var(--ink); }

  .card {
    position: fixed; left: 24px; bottom: 24px;
    display: flex; gap: 16px; align-items: center;
    width: 420px; max-width: calc(100% - 48px); padding: 14px 18px 14px 14px;
    background: var(--glass); backdrop-filter: blur(14px);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .07);
    transform: translateX(-120%); opacity: 0;
    transition: transform .6s cubic-bezier(.2, .9, .2, 1), opacity .4s;
  }
  .card.show { transform: none; opacity: 1; }
  .card::before { /* halo tiré de la pochette */
    content: ""; position: absolute; inset: -40% auto -40% -20%; width: 60%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: .22; transition: background .8s; pointer-events: none;
  }

  .cover { position: relative; flex: none; width: 88px; height: 88px; border-radius: 12px;
    background: #222 center / cover no-repeat; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
  .cover.empty::after { content: "♪"; position: absolute; inset: 0; display: grid;
    place-items: center; font-size: 38px; color: var(--ink-dim); }

  .meta { position: relative; flex: 1; min-width: 0; }
  .title { font-size: 19px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .artist { margin-top: 2px; font-size: 14px; color: var(--ink-dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .source { margin-top: 10px; font-size: 12px; color: var(--ink-dim); }

  .bar { margin-top: 8px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: background .8s; }
  .paused .fill { opacity: .45; }
  .times { display: flex; justify-content: space-between; margin-top: 4px;
    font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

  .status { position: fixed; left: 24px; bottom: 24px; padding: 10px 14px; border-radius: 12px;
    background: rgba(40, 20, 20, .85); font-size: 13px; display: none; }
  .status.show { display: block; }

  @media (prefers-reduced-motion: reduce) { .card { transition: opacity .2s; transform: none; } }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="cover empty" id="cover"></div>
  <div class="meta">
    <div class="title" id="title">—</div>
    <div class="artist" id="artist"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
  </div>
</div>

<div class="status" id="status">Lance now_playing_server.py pour activer l'overlay.</div>

<script>
/* Options dans l'URL : ?port=8765  &pos=left|right  &hide=15  (masque après N s de pause) */
const params = new URLSearchParams(location.search);
const PORT = params.get("port") || 8765;
const HIDE_AFTER = Number(params.get("hide") || 0);
if (params.get("pos") === "right") {
  const s = document.createElement("style");
  s.textContent = ".card{left:auto;right:24px;transform:translateX(120%)}.card.show{transform:none}";
  document.head.appendChild(s);
}

const $ = id => document.getElementById(id);
const card = $("card"), cover = $("cover"), statusBox = $("status");
let current = { key: "", position: 0, duration: 0, playing: false, at: 0 };
let pausedSince = null;

const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

function accentFromImage(url) {
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 24;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, 24, 24);
      const d = x.getImageData(0, 0, 24, 24).data;
      let best = null, bestScore = -1;
      for (let i = 0; i < d.length; i += 4) {
        const [r, g, b] = [d[i], d[i + 1], d[i + 2]];
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const score = (max - min) * (max / 255); // couleurs vives et lumineuses
        if (score > bestScore) { bestScore = score; best = [r, g, b]; }
      }
      if (best && bestScore > 40) document.documentElement.style.setProperty("--accent", `rgb(${best})`);
    } catch (e) {}
  };
  img.src = url;
}

function render(data) {
  statusBox.classList.remove("show");
  const key = data.title + "|" + data.artist;
  if (key !== current.key) {
    current.key = key;
    $("title").textContent = data.title;
    $("artist").textContent = data.artist || data.album || "";
    if (data.cover) {
      cover.style.backgroundImage = `url(${data.cover})`;
      cover.classList.remove("empty");
      accentFromImage(data.cover);
    } else {
      cover.style.backgroundImage = "";
      cover.classList.add("empty");
    }
  }
  current.position = data.position || 0;
  current.duration = data.duration || 0;
  current.playing = data.playing;
  current.at = performance.now();
  card.classList.toggle("paused", !data.playing);

  if (!data.playing) { pausedSince ??= Date.now(); } else { pausedSince = null; }
  const hidden = HIDE_AFTER && pausedSince && (Date.now() - pausedSince) / 1000 > HIDE_AFTER;
  card.classList.toggle("show", !hidden);
}

async function poll() {
  try {
    const res = await fetch(`http://127.0.0.1:${PORT}/now`, { cache: "no-store" });
    const data = await res.json();
    if (data.active) render(data);
    else { card.classList.remove("show"); current.key = ""; }
  } catch (e) {
    card.classList.remove("show");
    statusBox.classList.add("show");
  }
}

/* Barre de progression fluide entre deux sondages */
function tick() {
  let pos = current.position;
  if (current.playing) pos += (performance.now() - current.at) / 1000;
  if (current.duration > 0) pos = Math.min(pos, current.duration);
  $("fill").style.width = current.duration > 0 ? (pos / current.duration * 100) + "%" : "0%";
  $("pos").textContent = fmt(pos);
  $("dur").textContent = fmt(current.duration);
  requestAnimationFrame(tick);
}

poll(); setInterval(poll, 1000); tick();
</script>
</body>
</html>
